# O reels reaproveita o mesmo video do TikTok (grave sem marca d'agua).
# Basta colocar os arquivos na pasta media/AAAA-MM-DD/ com os nomes abaixo.
# A legenda do stories nao aparece (o Instagram nao aceita texto via API) - serve de lembrete.
